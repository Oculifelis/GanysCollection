plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    // Fundamentum, the shared core mod (local repo). Required dependency.
    maven { url = 'file:///H:/AI_MC_Modding/Fundamentum/repo'; content { includeGroup 'com.fundamentum' } }
    // Fundamentum needs Curios at runtime.
    maven { url = 'https://maven.theillusivec4.top/'; content { includeGroup 'top.theillusivec4.curios' } }
}

dependencies {
    // Fundamentum from the local maven. Nothing is compiled against it yet.
    runtimeOnly "com.fundamentum:fundamentum-neoforge:${fundamentum_version}"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.6.0+1.21.1"
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        // Boots a GameTest server, loads all mod data, runs any ganyscollection tests, then exits.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            jvmArgument '-Xmx2G'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            neo_version_range        : neo_version_range,
            fundamentum_version_range: fundamentum_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    from([file('LICENSE'), file('CREDITS.md')]) {
        into 'META-INF'
    }
}
